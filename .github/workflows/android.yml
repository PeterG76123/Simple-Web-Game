# Builds the Android app on GitHub, so no Android Studio is needed.
#
# Every run makes:
#   eel-escape-test.apk  install it straight onto an Android phone to try the app
#   eel-escape.aab       the bundle to upload to Google Play (signed, once the secrets below are set)
# Find them under the run's "Artifacts" (Actions tab > this workflow > a run).
#
# For a test build with every level unlocked: Actions > Android build > Run workflow,
# tick "Test build with every level unlocked". Its download is named ...-UNLOCKED.
#
# To sign the Play bundle, add these repository secrets (Settings > Secrets and variables > Actions):
#   ANDROID_KEYSTORE_BASE64    your upload keystore, base64-encoded (base64 -w0 upload.jks)
#   ANDROID_KEYSTORE_PASSWORD  its password
#   ANDROID_KEY_ALIAS          the key's alias
#   ANDROID_KEY_PASSWORD       the key's password
name: Android build

on:
  workflow_dispatch:
    inputs:
      unlock_all:
        description: 'Test build with every level unlocked (never for release)'
        type: boolean
        default: false
  push:
    paths-ignore: ['README.md', 'tools/**', 'levels-bank/**', '*.png']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # Downloads (with retries) and caches Gradle, the Android build tool.
      - uses: gradle/actions/setup-gradle@v4
      - name: Install
        run: npm ci
      - name: Copy the game into the app
        run: |
          node tools/build-www.js
          # A test build with every level open (only when asked for, from the Run workflow button).
          if [ "${{ inputs.unlock_all }}" = "true" ]; then
            sed -i 's/testUnlockAll: false/testUnlockAll: true/' www/config.js
            grep -q 'testUnlockAll: true' www/config.js
            echo "Every level unlocked in this build"
          fi
          npx cap sync android
      - name: Set up the upload key (if there is one)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          fi
      - name: Build
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug bundleRelease --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/eel-escape-test.apk"
          cp app/build/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/eel-escape.aab"
      - uses: actions/upload-artifact@v4
        with:
          name: eel-escape-android-${{ github.run_number }}${{ inputs.unlock_all && '-UNLOCKED' || '' }}
          path: |
            ${{ runner.temp }}/eel-escape-test.apk
            ${{ runner.temp }}/eel-escape.aab
