# Builds the iPhone app on GitHub's Macs, so no Mac is needed.
#
# Without the secrets below it only checks that the app builds (unsigned).
# With them, it signs the app and uploads it to App Store Connect, where it
# appears in TestFlight for testing and can then be submitted to the App Store.
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   APPLE_TEAM_ID                 the 10-character Team ID (developer.apple.com > Account > Membership)
#   APP_STORE_CONNECT_KEY_ID      an App Store Connect API key's Key ID (App Store Connect > Users and Access > Integrations)
#   APP_STORE_CONNECT_ISSUER_ID   the Issuer ID shown above that key list
#   APP_STORE_CONNECT_KEY         the whole contents of the key's .p8 file (role: App Manager)
name: iOS build

on:
  workflow_dispatch:
    inputs:
      upload:
        description: 'Upload to App Store Connect / TestFlight (needs the secrets above)'
        type: boolean
        default: true

jobs:
  build:
    runs-on: macos-26
    env:
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      ASC_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
    steps:
      - uses: actions/checkout@v4
      # Apple only accepts uploads built with the newest Xcode (26+ now, 27+ from April 2027).
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Copy the game into the app
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          node tools/build-www.js
          npx cap sync ios
      - name: Check it builds (unsigned, no secrets)
        if: env.ASC_KEY == '' || !inputs.upload
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build | tail -n 40
          test "${PIPESTATUS[0]}" -eq 0
      - name: Sign and upload to App Store Connect
        if: env.ASC_KEY != '' && inputs.upload
        run: |
          KEY="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          printf '%s' "$ASC_KEY" > "$KEY"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic CODE_SIGN_IDENTITY="Apple Distribution" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} "${AUTH[@]}" archive | tail -n 40
          test "${PIPESTATUS[0]}" -eq 0
          # Signed for distribution from the start: the default development signing would need
          # a registered iPhone, which an App Store upload doesn't.
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export" "${AUTH[@]}"
