<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Eel Escape</title>
  <meta name="description" content="A puzzle game: drag each tangled line off the board the way its arrow points, using see-through gaps to get past other lines." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap" />
  <link rel="stylesheet" href="style.css?v=b54c176c" />
</head>
<body>
  <!-- The ocean: drifting light rays and rising bubbles behind everything. -->
  <div class="ocean" aria-hidden="true">
    <span style="--x:6%;--s:8px;--t:16s;--d:-2s"></span>
    <span style="--x:14%;--s:14px;--t:21s;--d:-9s"></span>
    <span style="--x:23%;--s:6px;--t:13s;--d:-5s"></span>
    <span style="--x:35%;--s:10px;--t:18s;--d:-14s"></span>
    <span style="--x:47%;--s:5px;--t:12s;--d:-1s"></span>
    <span style="--x:58%;--s:12px;--t:20s;--d:-11s"></span>
    <span style="--x:66%;--s:7px;--t:15s;--d:-7s"></span>
    <span style="--x:75%;--s:16px;--t:24s;--d:-3s"></span>
    <span style="--x:84%;--s:6px;--t:14s;--d:-12s"></span>
    <span style="--x:92%;--s:11px;--t:19s;--d:-6s"></span>
  </div>

  <!-- Front screen -->
  <section id="menu" class="screen active" aria-label="Main menu">
    <button id="menuSettingsBtn" class="btn ghost icon-btn corner-btn" data-open-settings aria-label="Settings" title="Settings"><svg class="gear" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M19.1 10.6 L21.7 10.7 L21.7 13.3 L19.1 13.4 L18.0 16.0 L19.8 18.0 L18.0 19.8 L16.0 18.0 L13.4 19.1 L13.3 21.7 L10.7 21.7 L10.6 19.1 L8.0 18.0 L6.0 19.8 L4.2 18.0 L6.0 16.0 L4.9 13.4 L2.3 13.3 L2.3 10.7 L4.9 10.6 L6.0 8.0 L4.2 6.0 L6.0 4.2 L8.0 6.0 L10.6 4.9 L10.7 2.3 L13.3 2.3 L13.4 4.9 L16.0 6.0 L18.0 4.2 L19.8 6.0 L18.0 8.0Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></button>
    <div class="menu-card">
      <div class="logo" aria-hidden="true">
        <!-- Two glowing eels that never cross: cyan along the top, pink along the bottom. -->
        <svg viewBox="0 0 132 70" width="150" height="80">
          <path d="M8 42 C8 22 22 14 40 14 C54 14 60 8 74 12" fill="none" stroke="var(--c1)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" opacity="0.35" transform="translate(0 1)"/>
          <path d="M8 42 C8 22 22 14 40 14 C54 14 60 8 74 12" fill="none" stroke="var(--c1)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M72 2 L92 12 L72 22 Q76 12 72 2 Z" fill="var(--c1)"/>
          <circle cx="80" cy="9" r="2.4" fill="#fff"/><circle cx="80.6" cy="9" r="1.1" fill="#021022"/>
          <path d="M28 34 C28 50 42 58 60 56 C76 54 84 48 98 54" fill="none" stroke="var(--c2)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M96 44 L116 54 L96 64 Q100 54 96 44 Z" fill="var(--c2)"/>
          <circle cx="104" cy="51" r="2.4" fill="#fff"/><circle cx="104.6" cy="51" r="1.1" fill="#021022"/>
        </svg>
      </div>
      <h1>Eel Escape</h1>
      <p class="tagline">Guide the glowing eels out of the deep.</p>

      <h2 class="section-label">Levels</h2>
      <div id="tierTabs" class="tier-tabs" role="tablist" aria-label="Difficulty"></div>
      <div id="groupTabs" class="group-tabs" role="tablist" aria-label="Level groups"></div>
      <p id="groupNote" class="group-note" hidden></p>
      <div id="levelGrid" class="level-grid"></div>

    </div>
  </section>

  <!-- Game screen: the title at the top, the board centred in the space
       left, and big buttons along the bottom within reach of a thumb. -->
  <section id="game" class="screen" aria-label="Game">
    <header class="hud">
      <div class="hud-center">
        <div id="levelLabel" class="level-label">Level 1</div>
        <div id="moves" class="moves">0 moves</div>
      </div>
      <div class="hud-buttons">
        <button id="helpBtn" class="btn ghost icon-btn hud-gear help-btn" aria-label="How to play this group" title="How to play this group">?</button>
        <button id="gameSettingsBtn" class="btn ghost icon-btn hud-gear" data-open-settings aria-label="Settings" title="Settings"><svg class="gear" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M19.1 10.6 L21.7 10.7 L21.7 13.3 L19.1 13.4 L18.0 16.0 L19.8 18.0 L18.0 19.8 L16.0 18.0 L13.4 19.1 L13.3 21.7 L10.7 21.7 L10.6 19.1 L8.0 18.0 L6.0 19.8 L4.2 18.0 L6.0 16.0 L4.9 13.4 L2.3 13.3 L2.3 10.7 L4.9 10.6 L6.0 8.0 L4.2 6.0 L6.0 4.2 L8.0 6.0 L10.6 4.9 L10.7 2.3 L13.3 2.3 L13.4 4.9 L16.0 6.0 L18.0 4.2 L19.8 6.0 L18.0 8.0Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></button>
      </div>
    </header>

    <!-- The board, with the line count and hint tucked under it, centred in
         the space between the title and the buttons. -->
    <div class="board-area">
      <div id="boardWrap" class="board-wrap">
        <canvas id="board"></canvas>
      </div>
      <div class="board-footer">
        <p id="remaining" class="remaining"></p>
        <!-- Pinch with two fingers to zoom and move around; these do the same. -->
        <div id="zoomControls" class="zoom-controls" hidden>
          <button id="zoomOut" class="zoom-btn" aria-label="Zoom out" title="Zoom out">&minus;</button>
          <button id="zoomIn" class="zoom-btn" aria-label="Zoom in" title="Zoom in">+</button>
          <button id="zoomFit" class="zoom-btn" aria-label="Show the whole board" title="Show the whole board">&#10530;</button>
        </div>
      </div>
      <p id="hint" class="hint" aria-live="polite"></p>
    </div>

    <nav class="action-bar" aria-label="Level controls">
      <button id="menuBtn" class="action-btn" title="Back to the menu"><svg class="action-icon" viewBox="0 0 24 24" width="26" height="26" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg><span>Back</span></button>
      <button id="undoBtn" class="action-btn" title="Undo (Ctrl+Z)"><svg class="action-icon" viewBox="0 0 24 24" width="26" height="26" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg><span>Undo</span></button>
      <button id="restartBtn" class="action-btn" title="Start the level again"><svg class="action-icon" viewBox="0 0 24 24" width="26" height="26" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.35-5.65"/><path d="M20 4v5h-5"/></svg><span>Reset</span></button>
      <button id="hintBtn" class="action-btn hint-btn" title="Hint (H)"><svg class="action-icon" viewBox="0 0 24 24" width="26" height="26" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 18h5M10.5 21h3"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.7.6 1.1 1.3 1.1 2.2h5c0-.9.4-1.6 1.1-2.2A6 6 0 0 0 12 3Z"/></svg><span>Hint</span></button>
    </nav>
  </section>

  <!-- Welcome to a group: a looping demo of its new mechanic -->
  <div id="introOverlay" class="overlay" hidden>
    <div class="dialog intro" role="dialog" aria-modal="true" aria-labelledby="introTitle" aria-describedby="introText">
      <p class="intro-kicker">How to play</p>
      <h2 id="introTitle"></h2>
      <canvas id="introCanvas" class="intro-canvas" aria-hidden="true"></canvas>
      <p id="introText" class="intro-text"></p>
      <button id="introDismiss" class="btn primary">Dismiss</button>
    </div>
  </div>

  <!-- Settings -->
  <div id="settingsOverlay" class="overlay" hidden>
    <div class="dialog settings" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
      <h2 id="settingsTitle">Settings</h2>
      <div class="setting">
        <label class="setting-row" for="setMusic"><span class="setting-name">Music</span>
          <input type="checkbox" id="setMusic" class="switch" role="switch"></label>
        <input type="range" id="setMusicVol" class="volume" min="0" max="100" step="1" aria-label="Music volume">
      </div>
      <div class="setting">
        <label class="setting-row" for="setSfx"><span class="setting-name">Sound effects</span>
          <input type="checkbox" id="setSfx" class="switch" role="switch"></label>
        <input type="range" id="setSfxVol" class="volume" min="0" max="100" step="1" aria-label="Sound effects volume">
      </div>
      <div class="setting">
        <label class="setting-row" for="setCreatures"><span class="setting-name">Sea creatures
          <small>Fish, turtles and whales swimming in the background</small></span>
          <input type="checkbox" id="setCreatures" class="switch" role="switch"></label>
      </div>
      <button id="settingsDone" class="btn primary">Done</button>
    </div>
  </div>

  <!-- Win / lose dialog -->
  <div id="overlay" class="overlay" hidden>
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle">
      <h2 id="dialogTitle"></h2>
      <p id="dialogText"></p>
      <div id="dialogButtons" class="dialog-buttons"></div>
    </div>
  </div>

  <script src="settings.js?v=b86c4aea"></script>
  <script src="audio.js?v=5a681982"></script>
  <script src="rules.js?v=662de468"></script>
  <script src="levels-data.js?v=0b531cdb"></script>
  <script src="intro.js?v=5d593108"></script>
  <script src="sea-life.js?v=0d6e1358"></script>
  <script src="game.js?v=96b54d90"></script>
</body>
</html>
